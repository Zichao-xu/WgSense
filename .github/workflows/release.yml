name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-alpha)'
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Verify Go core
        working-directory: core
        run: |
          go vet ./...
          go test -race ./...

      - name: Build macOS app
        working-directory: platforms/macos
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project WgSense.xcodeproj -scheme WgSense \
            -configuration Release build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            -derivedDataPath build

      - name: Verify HUD model and motion
        run: |
          ./tests/hud/check-monitor.sh
          ./tests/hud/check-motion.sh

      - name: Verify app bundle
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          app="platforms/macos/build/Build/Products/Release/WgSense.app"
          test -x "$app/Contents/Resources/libexec/wgsense-daemon"
          test -x "$app/Contents/Resources/packaging/wgsense-install-services.sh"
          test -x "$app/Contents/Resources/packaging/wgsense-uninstall-services.sh"
          test -f "$app/Contents/Resources/AppIcon.icns"
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = "26.0"
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          test -f "docs/releases/$tag.md"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "${tag#v}"
          widget="$app/Contents/PlugIns/WgSenseWidget.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$widget/Contents/Info.plist")" = "${tag#v}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$widget/Contents/Info.plist")" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")"
          codesign --verify --deep --strict "$app"

      - name: Create install DMG
        run: |
          brew install create-dmg
          chmod +x packaging/create-dmg.sh
          packaging/create-dmg.sh \
            platforms/macos/build/Build/Products/Release/WgSense.app \
            WgSense-macOS.dmg
          shasum -a 256 WgSense-macOS.dmg > SHA256SUMS.txt

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: WgSense-macOS
          path: |
            WgSense-macOS.dmg
            SHA256SUMS.txt

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: WgSense-macOS
          path: artifacts/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: WgSense ${{ steps.tag.outputs.tag }}
          body_path: docs/releases/${{ steps.tag.outputs.tag }}.md
          files: |
            artifacts/WgSense-macOS.dmg
            artifacts/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
