name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-core:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  macos-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: platforms/macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Verify HUD model and motion
        working-directory: .
        run: |
          ./tests/hud/check-monitor.sh
          ./tests/hud/check-motion.sh
      - name: Verify product README
        working-directory: .
        run: |
          python3 tests/docs/check-readme.py
          python3 docs/images/check-media.py --static
      - name: Verify all app icon representations
        working-directory: .
        run: xcrun swift branding/GenerateAppIcon.swift --check
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project WgSense.xcodeproj -scheme WgSense -configuration Debug build -destination 'platform=macOS' CODE_SIGN_IDENTITY="-" -derivedDataPath build
      - name: Verify native light and dark brand artwork
        run: zsh ../../tests/branding/check-appearance.sh build/Build/Products/Debug/WgSense.app build/brand-checks
