name: WgSense
options:
  bundleIdPrefix: com.wgsense
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  WgSense:
    type: application
    platform: macOS
    sources:
      - path: WgSense
    preBuildScripts:
      - name: Build Bundled Daemon
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          core_dir="$SRCROOT/../../core"
          packaging_dir="$SRCROOT/../../packaging"
          out_dir="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/libexec"
          packaging_out="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/packaging"
          mkdir -p "$out_dir" "$packaging_out"
          (cd "$core_dir" && /usr/bin/env go build -trimpath -o "$out_dir/wgsense-daemon" ./cmd/wgsense-daemon)
          chmod 0755 "$out_dir/wgsense-daemon"
          install -m 0755 "$packaging_dir/wgsense-install-services.sh" "$packaging_out/wgsense-install-services.sh"
          install -m 0755 "$packaging_dir/wgsense-uninstall-services.sh" "$packaging_out/wgsense-uninstall-services.sh"
          install -m 0755 "$packaging_dir/wgsense-receive-mover.sh" "$packaging_out/wgsense-receive-mover.sh"
          install -m 0644 "$packaging_dir/com.wgsense.daemon.plist.template" "$packaging_out/com.wgsense.daemon.plist.template"
          install -m 0644 "$packaging_dir/com.wgsense.receive-mover.plist.template" "$packaging_out/com.wgsense.receive-mover.plist.template"
    dependencies:
      - target: WgSenseWidget
        embed: true
      - target: WgSensePacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wgsense.macos
        MARKETING_VERSION: "0.3.8"
        CURRENT_PROJECT_VERSION: "12"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_KEY_CFBundleDisplayName: WgSense
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: WgSense/WgSense.entitlements
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES

  WgSensePacketTunnel:
    type: app-extension
    platform: macOS
    sources:
      - path: WgSensePacketTunnel
        excludes:
          - WireGuardKitGo/*.go
          - WireGuardKitGo/go.mod
          - WireGuardKitGo/go.sum
          - WireGuardKitGo/Makefile
          - WireGuardKitGo/goruntime-boottime-over-monotonic.diff
          - WireGuardKit.COPYING
    preBuildScripts:
      - name: Build WireGuard Go Backend
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          make -C "$SRCROOT/WgSensePacketTunnel/WireGuardKitGo" \
            PLATFORM_NAME="$PLATFORM_NAME" \
            ARCHS="$ARCHS" \
            SDKROOT="$SDKROOT" \
            CONFIGURATION_BUILD_DIR="$BUILT_PRODUCTS_DIR" \
            CONFIGURATION_TEMP_DIR="$PROJECT_TEMP_DIR/WireGuardKitGo"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wgsense.macos.PacketTunnel
        PRODUCT_NAME: WgSensePacketTunnel
        MARKETING_VERSION: "0.3.8"
        CURRENT_PROJECT_VERSION: "12"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: WgSensePacketTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: WgSensePacketTunnel/WgSensePacketTunnel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: WgSensePacketTunnel/WgSensePacketTunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/WgSensePacketTunnel/WireGuardKitC $(SRCROOT)/WgSensePacketTunnel/WireGuardKitGo"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
        OTHER_LDFLAGS: "$(inherited) -lwg-go"

  WgSenseWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: WgSenseWidget
      - path: WgSense/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wgsense.macos.widget
        PRODUCT_NAME: WgSenseWidget
        MARKETING_VERSION: "0.3.8"
        CURRENT_PROJECT_VERSION: "12"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: WgSenseWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: ""
